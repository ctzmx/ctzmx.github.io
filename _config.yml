# Site settings
title: ctzmx Blog
description: "学习笔记、折腾记录和一点随笔。"
keyword: "ctzmx, blog, markdown, notes, ai"
url: "https://ctzmx.github.io"
baseurl: ""
timezone: Asia/Shanghai
email: ctzmx05@gmail.com
github_username: ctzmx

# Display settings
header-img: /img/ct/1%20(218).jpg

# Build settings
permalink: pretty
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: ctzmx
      catalog: true

# Keep development files out of the generated public site.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts
  - vendor
