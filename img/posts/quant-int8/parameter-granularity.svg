<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1178" viewBox="0 0 720 1178" role="img" aria-labelledby="title desc">
<title id="title">量化粒度：哪些权重共用参数？</title>
<desc id="desc">三图均为同一个4行8列权重矩阵，每行代表一个输出通道，每格代表一个权重，未表示权重数值或大小。per-tensor全张量共用一套参数；per-channel按行使用4套参数；per-group沿每行每4个权重分组，使用8套参数。颜色和s,z编号同时标记参数共享。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif;font-variant-numeric:tabular-nums}</style>
