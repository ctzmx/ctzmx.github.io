<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="918" viewBox="0 0 960 918" role="img" aria-labelledby="title desc">
<title id="title">显存账单：不只有“本次激活的参数”</title>
<desc id="desc">常规 GPU 常驻部署的显存由模型权重、KV cache 和临时工作区等组成。全部共享权重和专家权重需由部署系统容纳，分片后每卡只存对应分片。KV cache 取决于并发、上下文长度、注意力结构和缓存精度。临时工作区包括中间激活、路由索引、通信缓冲等。本图为分类示意，面积不代表占用比例。</desc>
<defs><marker id="arrow-line" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#9aabc0"/></marker><marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#2864ce"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#087e86"/></marker><marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#b96111"/></marker><marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#7851bd"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",system-ui,sans-serif;font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="960" height="918" rx="18" fill="#f7f9fc" stroke="none" stroke-width="2"/>
<text x="36" y="53" font-size="34" fill="#172b45" text-anchor="start" font-weight="700">显存账单：不只有“本次激活的参数”</text>
<text x="36" y="96" font-size="26" fill="#52657c" text-anchor="start" font-weight="400">常规 GPU 常驻部署；卡片面积不代表实际占比</text>
<rect x="24" y="128" width="912" height="218" rx="12" fill="white" stroke="none" stroke-width="2"/>
<rect x="48" y="152" width="292" height="168" rx="12" fill="#e9f0ff" stroke="none" stroke-width="2"/><text x="194.0" y="245.45" font-size="27" fill="#2864ce" text-anchor="middle" font-weight="600">① 常驻模型权重</text>
<text x="370" y="191" font-size="25" fill="#172b45" text-anchor="start" font-weight="600">共享参数 + 全部专家参数</text>
<text x="370" y="246" font-size="25" fill="#52657c" text-anchor="start" font-weight="400">分片时，每张卡保存对应部分</text>
<text x="370" y="301" font-size="25" fill="#52657c" text-anchor="start" font-weight="400">只激活 top-k，不等于只存 top-k</text>
<rect x="24" y="370" width="912" height="218" rx="12" fill="white" stroke="none" stroke-width="2"/>
<rect x="48" y="394" width="292" height="168" rx="12" fill="#e5f5f3" stroke="none" stroke-width="2"/><text x="194.0" y="487.45" font-size="27" fill="#087e86" text-anchor="middle" font-weight="600">② KV cache</text>
<text x="370" y="433" font-size="25" fill="#172b45" text-anchor="start" font-weight="600">缓存历史 token 的注意力 K、V</text>
<text x="370" y="488" font-size="25" fill="#52657c" text-anchor="start" font-weight="400">取决于并发、上下文、注意力结构与精度</text>
<text x="370" y="543" font-size="25" fill="#52657c" text-anchor="start" font-weight="400">通常不因 FFN 只选少数专家而同比缩小</text>
<rect x="24" y="612" width="912" height="218" rx="12" fill="white" stroke="none" stroke-width="2"/>
<rect x="48" y="636" width="292" height="168" rx="12" fill="#f0eafa" stroke="none" stroke-width="2"/><text x="194.0" y="729.45" font-size="27" fill="#7851bd" text-anchor="middle" font-weight="600">③ 临时工作区</text>
<text x="370" y="675" font-size="25" fill="#172b45" text-anchor="start" font-weight="600">中间激活、专家分组、路由索引</text>
<text x="370" y="730" font-size="25" fill="#52657c" text-anchor="start" font-weight="400">Dispatch / Combine 通信缓冲</text>
<text x="370" y="785" font-size="25" fill="#52657c" text-anchor="start" font-weight="400">还需给框架运行与内存管理留出余量</text>
<text x="36" y="884" font-size="27" fill="#172b45" text-anchor="start" font-weight="600">先估总权重，再加缓存与工作区，最后核对每卡容量。</text>
</svg>
