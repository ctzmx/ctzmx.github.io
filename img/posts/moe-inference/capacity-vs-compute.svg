<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="920" viewBox="0 0 720 920" role="img" aria-labelledby="title desc">
<title id="title">N 与 k：存多少专家，每次算多少专家</title>
<desc id="desc">只统计同尺寸路由 FFN 专家的权重与主要算术量，省略 Router 和共享部分。N=4,k=1：保存4份专家权重，每个token执行1份；N=8,k=1：保存8份，每个token仍执行1份；N=8,k=2：保存8份，每个token执行2份。橙色表示当前token选中，灰色表示未选但权重仍保存。增加N还会增加Router等成本，图不预测实际速度或质量。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",system-ui,sans-serif;font-variant-numeric:tabular-nums}</style>
<defs><marker id="a2864ce" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5.5 L0,11 Z" fill="#2864ce"/></marker><marker id="a7851bd" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5.5 L0,11 Z" fill="#7851bd"/></marker><marker id="ab96111" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5.5 L0,11 Z" fill="#b96111"/></marker></defs>
<rect x="0" y="0" width="720" height="920" rx="18" fill="#f7f9fc"/>
<text x="28" y="48" font-size="32" fill="#172b45" text-anchor="start" font-weight="700">N 与 k：两个不同的选择</text>
<text x="28" y="88" font-size="25" fill="#52657c" text-anchor="start" font-weight="400">N = 专家总数；k = 每个 token 选中的个数</text>
<rect x="28" y="112" width="22" height="22" rx="4" fill="#fff0de"/>
<text x="60" y="133" font-size="23" fill="#b96111" text-anchor="start" font-weight="400">当前选中</text>
<rect x="220" y="112" width="22" height="22" rx="4" fill="#e9edf3"/>
<text x="252" y="133" font-size="23" fill="#52657c" text-anchor="start" font-weight="400">未选中，但权重仍保存</text>
<rect x="24" y="156" width="672" height="184" rx="12" fill="white"/>
<text x="44" y="198" font-size="28" fill="#172b45" text-anchor="start" font-weight="700">① 基准：N = 4，k = 1</text>
<rect x="48" y="219" width="66" height="49" rx="8" fill="#fff0de"/>
<text x="81" y="253" font-size="25" fill="#b96111" text-anchor="middle" font-weight="700">E1</text>
<rect x="126" y="219" width="66" height="49" rx="8" fill="#e9edf3"/>
<text x="159" y="253" font-size="25" fill="#52657c" text-anchor="middle" font-weight="400">E2</text>
<rect x="204" y="219" width="66" height="49" rx="8" fill="#e9edf3"/>
<text x="237" y="253" font-size="25" fill="#52657c" text-anchor="middle" font-weight="400">E3</text>
<rect x="282" y="219" width="66" height="49" rx="8" fill="#e9edf3"/>
<text x="315" y="253" font-size="25" fill="#52657c" text-anchor="middle" font-weight="400">E4</text>
<text x="48" y="313" font-size="28" fill="#2864ce" text-anchor="start" font-weight="700">共存 4 份权重</text>
<text x="354" y="313" font-size="28" fill="#b96111" text-anchor="start" font-weight="700">每 token 算 1 份</text>
<rect x="24" y="356" width="672" height="184" rx="12" fill="white"/>
<text x="44" y="398" font-size="28" fill="#7851bd" text-anchor="start" font-weight="700">② 增加 N：N = 8，k = 1</text>
<rect x="48" y="419" width="66" height="49" rx="8" fill="#fff0de"/>
<text x="81" y="453" font-size="25" fill="#b96111" text-anchor="middle" font-weight="700">E1</text>
<rect x="126" y="419" width="66" height="49" rx="8" fill="#e9edf3"/>
<text x="159" y="453" font-size="25" fill="#52657c" text-anchor="middle" font-weight="400">E2</text>
<rect x="204" y="419" width="66" height="49" rx="8" fill="#e9edf3"/>
<text x="237" y="453" font-size="25" fill="#52657c" text-anchor="middle" font-weight="400">E3</text>
<rect x="282" y="419" width="66" height="49" rx="8" fill="#e9edf3"/>
<text x="315" y="453" font-size="25" fill="#52657c" text-anchor="middle" font-weight="400">E4</text>
<rect x="360" y="419" width="66" height="49" rx="8" fill="#e9edf3"/>
<text x="393" y="453" font-size="25" fill="#52657c" text-anchor="middle" font-weight="400">E5</text>
<rect x="438" y="419" width="66" height="49" rx="8" fill="#e9edf3"/>
<text x="471" y="453" font-size="25" fill="#52657c" text-anchor="middle" font-weight="400">E6</text>
<rect x="516" y="419" width="66" height="49" rx="8" fill="#e9edf3"/>
<text x="549" y="453" font-size="25" fill="#52657c" text-anchor="middle" font-weight="400">E7</text>
<rect x="594" y="419" width="66" height="49" rx="8" fill="#e9edf3"/>
<text x="627" y="453" font-size="25" fill="#52657c" text-anchor="middle" font-weight="400">E8</text>
<text x="48" y="513" font-size="28" fill="#2864ce" text-anchor="start" font-weight="700">共存 8 份权重</text>
<text x="354" y="513" font-size="28" fill="#b96111" text-anchor="start" font-weight="700">每 token 算 1 份</text>
<rect x="24" y="556" width="672" height="184" rx="12" fill="white"/>
<text x="44" y="598" font-size="28" fill="#172b45" text-anchor="start" font-weight="700">③ 增加 k：N = 8，k = 2</text>
<rect x="48" y="619" width="66" height="49" rx="8" fill="#fff0de"/>
<text x="81" y="653" font-size="25" fill="#b96111" text-anchor="middle" font-weight="700">E1</text>
<rect x="126" y="619" width="66" height="49" rx="8" fill="#fff0de"/>
<text x="159" y="653" font-size="25" fill="#b96111" text-anchor="middle" font-weight="700">E2</text>
<rect x="204" y="619" width="66" height="49" rx="8" fill="#e9edf3"/>
<text x="237" y="653" font-size="25" fill="#52657c" text-anchor="middle" font-weight="400">E3</text>
<rect x="282" y="619" width="66" height="49" rx="8" fill="#e9edf3"/>
<text x="315" y="653" font-size="25" fill="#52657c" text-anchor="middle" font-weight="400">E4</text>
<rect x="360" y="619" width="66" height="49" rx="8" fill="#e9edf3"/>
<text x="393" y="653" font-size="25" fill="#52657c" text-anchor="middle" font-weight="400">E5</text>
<rect x="438" y="619" width="66" height="49" rx="8" fill="#e9edf3"/>
<text x="471" y="653" font-size="25" fill="#52657c" text-anchor="middle" font-weight="400">E6</text>
<rect x="516" y="619" width="66" height="49" rx="8" fill="#e9edf3"/>
<text x="549" y="653" font-size="25" fill="#52657c" text-anchor="middle" font-weight="400">E7</text>
<rect x="594" y="619" width="66" height="49" rx="8" fill="#e9edf3"/>
<text x="627" y="653" font-size="25" fill="#52657c" text-anchor="middle" font-weight="400">E8</text>
<text x="48" y="713" font-size="28" fill="#2864ce" text-anchor="start" font-weight="700">共存 8 份权重</text>
<text x="354" y="713" font-size="28" fill="#b96111" text-anchor="start" font-weight="700">每 token 算 2 份</text>
<text x="28" y="793" font-size="25" fill="#52657c" text-anchor="start" font-weight="400">假设：各专家同尺寸，只比较专家 FFN 主体。</text>
<text x="28" y="834" font-size="24" fill="#52657c" text-anchor="start" font-weight="400">Router 与共享部分未计入；N 变大也有额外开销。</text>
<text x="28" y="883" font-size="26" fill="#172b45" text-anchor="start" font-weight="700">“每次算几份”不能直接等同于速度或质量。</text>
</svg>