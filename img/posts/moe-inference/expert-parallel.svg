<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900" role="img" aria-labelledby="title desc">
<title id="title">专家并行：激活去找专家，再返回</title>
<desc id="desc">一种专家并行布局示意：8 个专家分置 4 张 GPU，每卡 2 个。输入 token 的隐藏状态按路由结果 dispatch 到对应专家，专家输出再 combine 回原 token 所在位置。实际路由可同时包含本地与远程专家；专家权重常驻所属 GPU，跨卡主要搬运激活、输出及路由元数据。</desc>
<defs><marker id="arrow-line" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#9aabc0"/></marker><marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#2864ce"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#087e86"/></marker><marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#b96111"/></marker><marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#7851bd"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",system-ui,sans-serif;font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="960" height="900" rx="18" fill="#f7f9fc" stroke="none" stroke-width="2"/>
<text x="36" y="53" font-size="34" fill="#172b45" text-anchor="start" font-weight="700">专家并行：激活去找专家，再返回</text>
<text x="36" y="96" font-size="26" fill="#52657c" text-anchor="start" font-weight="400">一层 MoE 的数据流；此图只展开专家部分</text>
<rect x="210" y="126" width="540" height="66" rx="12" fill="#e9f0ff" stroke="none" stroke-width="2"/><text x="480.0" y="169.15" font-size="29" fill="#2864ce" text-anchor="middle" font-weight="600">各 GPU 上的 token 隐藏状态</text>
<path d="M480,200 L480,230" fill="none" stroke="#7851bd" stroke-width="3" marker-end="url(#arrow-purple)"/>
<rect x="216" y="238" width="528" height="64" rx="12" fill="#f0eafa" stroke="none" stroke-width="2"/><text x="480.0" y="279.8" font-size="28" fill="#7851bd" text-anchor="middle" font-weight="600">Dispatch：按路由结果分发</text>
<path d="M480,310 L480,342 L132,342 M480,342 L834,342" fill="none" stroke="#7851bd" stroke-width="3"/>
<path d="M132,342 L132,380" fill="none" stroke="#7851bd" stroke-width="3" marker-end="url(#arrow-purple)"/>
<rect x="24" y="390" width="216" height="194" rx="12" fill="white" stroke="#9aabc0" stroke-width="2"/>
<text x="132" y="433" font-size="29" fill="#172b45" text-anchor="middle" font-weight="700">GPU 0</text>
<rect x="46" y="454" width="172" height="48" rx="12" fill="#fff0de" stroke="none" stroke-width="2"/><text x="132.0" y="487.8" font-size="28" fill="#b96111" text-anchor="middle" font-weight="600">E1  ·  E2</text>
<text x="132" y="548" font-size="23" fill="#52657c" text-anchor="middle" font-weight="400">专家权重常驻</text>
<path d="M132,592 L132,630" fill="none" stroke="#b96111" stroke-width="3" marker-end="url(#arrow-orange)"/>
<path d="M366,342 L366,380" fill="none" stroke="#7851bd" stroke-width="3" marker-end="url(#arrow-purple)"/>
<rect x="258" y="390" width="216" height="194" rx="12" fill="white" stroke="#9aabc0" stroke-width="2"/>
<text x="366" y="433" font-size="29" fill="#172b45" text-anchor="middle" font-weight="700">GPU 1</text>
<rect x="280" y="454" width="172" height="48" rx="12" fill="#fff0de" stroke="none" stroke-width="2"/><text x="366.0" y="487.8" font-size="28" fill="#b96111" text-anchor="middle" font-weight="600">E3  ·  E4</text>
<text x="366" y="548" font-size="23" fill="#52657c" text-anchor="middle" font-weight="400">专家权重常驻</text>
<path d="M366,592 L366,630" fill="none" stroke="#b96111" stroke-width="3" marker-end="url(#arrow-orange)"/>
<path d="M600,342 L600,380" fill="none" stroke="#7851bd" stroke-width="3" marker-end="url(#arrow-purple)"/>
<rect x="492" y="390" width="216" height="194" rx="12" fill="white" stroke="#9aabc0" stroke-width="2"/>
<text x="600" y="433" font-size="29" fill="#172b45" text-anchor="middle" font-weight="700">GPU 2</text>
<rect x="514" y="454" width="172" height="48" rx="12" fill="#fff0de" stroke="none" stroke-width="2"/><text x="600.0" y="487.8" font-size="28" fill="#b96111" text-anchor="middle" font-weight="600">E5  ·  E6</text>
<text x="600" y="548" font-size="23" fill="#52657c" text-anchor="middle" font-weight="400">专家权重常驻</text>
<path d="M600,592 L600,630" fill="none" stroke="#b96111" stroke-width="3" marker-end="url(#arrow-orange)"/>
<path d="M834,342 L834,380" fill="none" stroke="#7851bd" stroke-width="3" marker-end="url(#arrow-purple)"/>
<rect x="726" y="390" width="216" height="194" rx="12" fill="white" stroke="#9aabc0" stroke-width="2"/>
<text x="834" y="433" font-size="29" fill="#172b45" text-anchor="middle" font-weight="700">GPU 3</text>
<rect x="748" y="454" width="172" height="48" rx="12" fill="#fff0de" stroke="none" stroke-width="2"/><text x="834.0" y="487.8" font-size="28" fill="#b96111" text-anchor="middle" font-weight="600">E7  ·  E8</text>
<text x="834" y="548" font-size="23" fill="#52657c" text-anchor="middle" font-weight="400">专家权重常驻</text>
<path d="M834,592 L834,630" fill="none" stroke="#b96111" stroke-width="3" marker-end="url(#arrow-orange)"/>
<path d="M132,635 L834,635 M480,635 L480,663" fill="none" stroke="#b96111" stroke-width="3"/>
<path d="M480,651 L480,671" fill="none" stroke="#b96111" stroke-width="3" marker-end="url(#arrow-orange)"/>
<rect x="216" y="680" width="528" height="64" rx="12" fill="#f0eafa" stroke="none" stroke-width="2"/><text x="480.0" y="721.8" font-size="28" fill="#7851bd" text-anchor="middle" font-weight="600">Combine：回传、还原、加权</text>
<path d="M480,752 L480,776" fill="none" stroke="#7851bd" stroke-width="3" marker-end="url(#arrow-purple)"/>
<rect x="210" y="787" width="540" height="58" rx="12" fill="#e5f5f3" stroke="none" stroke-width="2"/><text x="480.0" y="825.8" font-size="28" fill="#087e86" text-anchor="middle" font-weight="600">回到各 token 的输出隐藏状态</text>
<text x="36" y="883" font-size="26" fill="#172b45" text-anchor="start" font-weight="600">跨卡搬运激活与输出；本地专家可以直接执行。</text>
</svg>
