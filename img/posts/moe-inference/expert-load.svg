<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="932" viewBox="0 0 960 932" role="img" aria-labelledby="title desc">
<title id="title">同样的任务总量，也会出现“忙闲不均”</title>
<desc id="desc">独立示例：32 个 token，每个 token 采用 Top-1 路由，仅选择一个专家。左右分别显示均衡专家负载 [8,8,8,8] 与不均衡负载 [20,8,2,2]，总量都是 32 份 token-expert assignments；使用同一纵轴比例。图表示任务量而非实测耗时。在吞吐与硬件可比、需要同步的简化场景下，较慢的专家或参与 GPU 会使其他参与者等待。</desc>
<defs><marker id="arrow-line" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#9aabc0"/></marker><marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#2864ce"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#087e86"/></marker><marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#b96111"/></marker><marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#7851bd"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",system-ui,sans-serif;font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="960" height="932" rx="18" fill="#f7f9fc" stroke="none" stroke-width="2"/>
<text x="36" y="53" font-size="34" fill="#172b45" text-anchor="start" font-weight="700">同样的任务总量，也会出现“忙闲不均”</text>
<text x="36" y="96" font-size="26" fill="#52657c" text-anchor="start" font-weight="400">独立示例：32 个 token，Top-1 路由，共 32 份任务</text>
<rect x="24" y="126" width="440" height="484" rx="12" fill="white" stroke="none" stroke-width="2"/>
<text x="244" y="174" font-size="28" fill="#087e86" text-anchor="middle" font-weight="700">均衡：8 / 8 / 8 / 8</text>
<text x="244" y="214" font-size="24" fill="#52657c" text-anchor="middle" font-weight="400">总任务数 = 32</text>
<path d="M86,540 L444,540" fill="none" stroke="#9aabc0" stroke-width="1"/>
<text x="74" y="548" font-size="22" fill="#52657c" text-anchor="end" font-weight="400">0</text>
<path d="M86,436 L444,436" fill="none" stroke="#9aabc0" stroke-width="1"/>
<text x="74" y="444" font-size="22" fill="#52657c" text-anchor="end" font-weight="400">8</text>
<path d="M86,280 L444,280" fill="none" stroke="#9aabc0" stroke-width="1"/>
<text x="74" y="288" font-size="22" fill="#52657c" text-anchor="end" font-weight="400">20</text>
<rect x="106" y="436" width="52" height="104" rx="3" fill="#e5f5f3" stroke="none" stroke-width="2"/>
<rect x="106" y="436" width="52" height="7" rx="2" fill="#087e86" stroke="none" stroke-width="2"/>
<text x="132" y="423" font-size="25" fill="#087e86" text-anchor="middle" font-weight="700">8</text>
<text x="132" y="582" font-size="24" fill="#172b45" text-anchor="middle" font-weight="400">E1</text>
<rect x="190" y="436" width="52" height="104" rx="3" fill="#e5f5f3" stroke="none" stroke-width="2"/>
<rect x="190" y="436" width="52" height="7" rx="2" fill="#087e86" stroke="none" stroke-width="2"/>
<text x="216" y="423" font-size="25" fill="#087e86" text-anchor="middle" font-weight="700">8</text>
<text x="216" y="582" font-size="24" fill="#172b45" text-anchor="middle" font-weight="400">E2</text>
<rect x="274" y="436" width="52" height="104" rx="3" fill="#e5f5f3" stroke="none" stroke-width="2"/>
<rect x="274" y="436" width="52" height="7" rx="2" fill="#087e86" stroke="none" stroke-width="2"/>
<text x="300" y="423" font-size="25" fill="#087e86" text-anchor="middle" font-weight="700">8</text>
<text x="300" y="582" font-size="24" fill="#172b45" text-anchor="middle" font-weight="400">E3</text>
<rect x="358" y="436" width="52" height="104" rx="3" fill="#e5f5f3" stroke="none" stroke-width="2"/>
<rect x="358" y="436" width="52" height="7" rx="2" fill="#087e86" stroke="none" stroke-width="2"/>
<text x="384" y="423" font-size="25" fill="#087e86" text-anchor="middle" font-weight="700">8</text>
<text x="384" y="582" font-size="24" fill="#172b45" text-anchor="middle" font-weight="400">E4</text>
<rect x="496" y="126" width="440" height="484" rx="12" fill="white" stroke="none" stroke-width="2"/>
<text x="716" y="174" font-size="28" fill="#b96111" text-anchor="middle" font-weight="700">不均衡：20 / 8 / 2 / 2</text>
<text x="716" y="214" font-size="24" fill="#52657c" text-anchor="middle" font-weight="400">总任务数 = 32</text>
<path d="M558,540 L916,540" fill="none" stroke="#9aabc0" stroke-width="1"/>
<text x="546" y="548" font-size="22" fill="#52657c" text-anchor="end" font-weight="400">0</text>
<path d="M558,436 L916,436" fill="none" stroke="#9aabc0" stroke-width="1"/>
<text x="546" y="444" font-size="22" fill="#52657c" text-anchor="end" font-weight="400">8</text>
<path d="M558,280 L916,280" fill="none" stroke="#9aabc0" stroke-width="1"/>
<text x="546" y="288" font-size="22" fill="#52657c" text-anchor="end" font-weight="400">20</text>
<rect x="578" y="280" width="52" height="260" rx="3" fill="#fff0de" stroke="none" stroke-width="2"/>
<rect x="578" y="280" width="52" height="7" rx="2" fill="#b96111" stroke="none" stroke-width="2"/>
<text x="604" y="267" font-size="25" fill="#b96111" text-anchor="middle" font-weight="700">20</text>
<text x="604" y="582" font-size="24" fill="#172b45" text-anchor="middle" font-weight="400">E1</text>
<rect x="662" y="436" width="52" height="104" rx="3" fill="#fff0de" stroke="none" stroke-width="2"/>
<rect x="662" y="436" width="52" height="7" rx="2" fill="#b96111" stroke="none" stroke-width="2"/>
<text x="688" y="423" font-size="25" fill="#b96111" text-anchor="middle" font-weight="700">8</text>
<text x="688" y="582" font-size="24" fill="#172b45" text-anchor="middle" font-weight="400">E2</text>
<rect x="746" y="514" width="52" height="26" rx="3" fill="#fff0de" stroke="none" stroke-width="2"/>
<rect x="746" y="514" width="52" height="7" rx="2" fill="#b96111" stroke="none" stroke-width="2"/>
<text x="772" y="501" font-size="25" fill="#b96111" text-anchor="middle" font-weight="700">2</text>
<text x="772" y="582" font-size="24" fill="#172b45" text-anchor="middle" font-weight="400">E3</text>
<rect x="830" y="514" width="52" height="26" rx="3" fill="#fff0de" stroke="none" stroke-width="2"/>
<rect x="830" y="514" width="52" height="7" rx="2" fill="#b96111" stroke="none" stroke-width="2"/>
<text x="856" y="501" font-size="25" fill="#b96111" text-anchor="middle" font-weight="700">2</text>
<text x="856" y="582" font-size="24" fill="#172b45" text-anchor="middle" font-weight="400">E4</text>
<rect x="24" y="636" width="912" height="212" rx="12" fill="white" stroke="none" stroke-width="2"/>
<text x="48" y="680" font-size="29" fill="#172b45" text-anchor="start" font-weight="700">为什么会影响延迟？</text>
<text x="48" y="728" font-size="27" fill="#172b45" text-anchor="start" font-weight="400">同步的一轮，要等本轮最慢的参与者完成。</text>
<text x="48" y="775" font-size="27" fill="#52657c" text-anchor="start" font-weight="400">短队列先做完，也可能仍在等待长队列。</text>
<text x="48" y="821" font-size="24" fill="#52657c" text-anchor="start" font-weight="400">前提：硬件与每份任务的处理开销近似可比。</text>
<text x="36" y="893" font-size="25" fill="#172b45" text-anchor="start" font-weight="600">图中只有任务量，没有实测时间；负载还受放置与调度影响。</text>
</svg>
