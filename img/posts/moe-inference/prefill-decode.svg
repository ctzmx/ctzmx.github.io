<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="920" viewBox="0 0 960 920" role="img" aria-labelledby="title desc">
<title id="title">一次生成，两个推理阶段</title>
<desc id="desc">Prompt t1、t2、t3 经 prefill 建立 KV cache，并从最后位置的 logits 采样首个输出 y1。接下来 decode 输入 y1，读取历史 KV 并追加 y1 的 KV，产生 y2；再输入 y2 产生 y3。箭头表示数据依赖，图中省略采样器内部细节。</desc>
<defs><marker id="arrow-line" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#9aabc0"/></marker><marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#2864ce"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#087e86"/></marker><marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#b96111"/></marker><marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#7851bd"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",system-ui,sans-serif;font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="960" height="920" rx="18" fill="#f7f9fc" stroke="none" stroke-width="2"/>
<text x="36" y="53" font-size="34" fill="#172b45" text-anchor="start" font-weight="700">一次生成，两个推理阶段</text>
<text x="36" y="96" font-size="26" fill="#52657c" text-anchor="start" font-weight="400">以一个请求为例；y1 是首个输出 token</text>
<rect x="24" y="122" width="912" height="238" rx="12" fill="white" stroke="none" stroke-width="2"/>
<text x="48" y="166" font-size="28" fill="#2864ce" text-anchor="start" font-weight="700">① Prefill：处理整个 prompt</text>
<rect x="52" y="198" width="250" height="68" rx="12" fill="#e9f0ff" stroke="none" stroke-width="2"/><text x="177.0" y="241.1" font-size="26" fill="#2864ce" text-anchor="middle" font-weight="600">t1   t2   t3</text>
<path d="M310,232 L365,232" fill="none" stroke="#9aabc0" stroke-width="3" marker-end="url(#arrow-line)"/>
<rect x="374" y="198" width="250" height="68" rx="12" fill="#e9f0ff" stroke="none" stroke-width="2"/><text x="499.0" y="241.1" font-size="26" fill="#2864ce" text-anchor="middle" font-weight="600">模型前向</text>
<path d="M632,232 L744,232" fill="none" stroke="#2864ce" stroke-width="3" marker-end="url(#arrow-blue)"/>
<text x="688" y="209" font-size="22" fill="#2864ce" text-anchor="middle" font-weight="400">末位置</text>
<rect x="754" y="198" width="148" height="68" rx="12" fill="#e5f5f3" stroke="none" stroke-width="2"/><text x="828.0" y="241.1" font-size="26" fill="#087e86" text-anchor="middle" font-weight="600">输出 y1</text>
<text x="688" y="276" font-size="22" fill="#52657c" text-anchor="middle" font-weight="400">logits → 采样</text>
<path d="M499,274 L499,292" fill="none" stroke="#087e86" stroke-width="3" marker-end="url(#arrow-teal)"/>
<rect x="346" y="300" width="306" height="42" rx="12" fill="#e5f5f3" stroke="none" stroke-width="2"/><text x="499.0" y="329.4" font-size="24" fill="#087e86" text-anchor="middle" font-weight="600">KV：t1、t2、t3</text>
<rect x="24" y="386" width="278" height="205" rx="12" fill="white" stroke="none" stroke-width="2"/>
<rect x="338" y="386" width="598" height="205" rx="12" fill="white" stroke="none" stroke-width="2"/>
<text x="48" y="426" font-size="28" fill="#2864ce" text-anchor="start" font-weight="700">② Decode 第 1 步</text>
<rect x="52" y="452" width="216" height="64" rx="12" fill="#e9f0ff" stroke="none" stroke-width="2"/><text x="160.0" y="493.1" font-size="26" fill="#2864ce" text-anchor="middle" font-weight="600">输入 y1</text>
<path d="M276,484 L366,484" fill="none" stroke="#9aabc0" stroke-width="3" marker-end="url(#arrow-line)"/>
<rect x="374" y="452" width="250" height="64" rx="12" fill="#e9f0ff" stroke="none" stroke-width="2"/><text x="499.0" y="493.1" font-size="26" fill="#2864ce" text-anchor="middle" font-weight="600">模型前向</text>
<path d="M632,484 L744,484" fill="none" stroke="#2864ce" stroke-width="3" marker-end="url(#arrow-blue)"/>
<rect x="754" y="452" width="148" height="64" rx="12" fill="#e5f5f3" stroke="none" stroke-width="2"/><text x="828.0" y="493.1" font-size="26" fill="#087e86" text-anchor="middle" font-weight="600">输出 y2</text>
<text x="360" y="554" font-size="25" fill="#087e86" text-anchor="start" font-weight="400">读历史 KV；追加 y1 的 KV</text>
<text x="48" y="554" font-size="23" fill="#52657c" text-anchor="start" font-weight="400">首个生成 token 回填</text>
<path d="M499,350 L499,441" fill="none" stroke="#087e86" stroke-width="3" marker-end="url(#arrow-teal)"/>
<text x="528" y="404" font-size="23" fill="#087e86" text-anchor="start" font-weight="400">读历史 KV</text>
<rect x="24" y="620" width="912" height="205" rx="12" fill="white" stroke="none" stroke-width="2"/>
<text x="48" y="661" font-size="28" fill="#2864ce" text-anchor="start" font-weight="700">③ Decode 第 2 步</text>
<rect x="52" y="686" width="216" height="64" rx="12" fill="#e9f0ff" stroke="none" stroke-width="2"/><text x="160.0" y="727.1" font-size="26" fill="#2864ce" text-anchor="middle" font-weight="600">输入 y2</text>
<path d="M276,718 L366,718" fill="none" stroke="#9aabc0" stroke-width="3" marker-end="url(#arrow-line)"/>
<rect x="374" y="686" width="250" height="64" rx="12" fill="#e9f0ff" stroke="none" stroke-width="2"/><text x="499.0" y="727.1" font-size="26" fill="#2864ce" text-anchor="middle" font-weight="600">模型前向</text>
<path d="M632,718 L744,718" fill="none" stroke="#2864ce" stroke-width="3" marker-end="url(#arrow-blue)"/>
<rect x="754" y="686" width="148" height="64" rx="12" fill="#e5f5f3" stroke="none" stroke-width="2"/><text x="828.0" y="727.1" font-size="26" fill="#087e86" text-anchor="middle" font-weight="600">输出 y3</text>
<text x="360" y="788" font-size="25" fill="#087e86" text-anchor="start" font-weight="400">读历史 KV；追加 y2 的 KV</text>
<text x="48" y="881" font-size="28" fill="#172b45" text-anchor="start" font-weight="600">同一请求逐步串行；批处理可并行多个请求</text>
</svg>
