<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="916" viewBox="0 0 960 916" role="img" aria-labelledby="title desc">
<title id="title">从 token 顺序，到专家分组，再还原</title>
<desc id="desc">4 个 token 的 top-2 路由：A 到 E1、E3；B 到 E2、E3；C 到 E1、E4；D 到 E2、E4。Dispatch 将 8 个 token-expert assignments 按专家重排，专家分别运行 FFN。Combine 将每个 token 的两个专家输出按路由权重求和，并还原原顺序。</desc>
<defs><marker id="arrow-line" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#9aabc0"/></marker><marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#2864ce"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#087e86"/></marker><marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#b96111"/></marker><marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#7851bd"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",system-ui,sans-serif;font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="960" height="916" rx="18" fill="#f7f9fc" stroke="none" stroke-width="2"/>
<text x="36" y="53" font-size="34" fill="#172b45" text-anchor="start" font-weight="700">从 token 顺序，到专家分组，再还原</text>
<text x="36" y="96" font-size="26" fill="#52657c" text-anchor="start" font-weight="400">示例：4 个 token、4 个专家，每 token 选 2 个</text>
<rect x="24" y="124" width="912" height="174" rx="12" fill="white" stroke="none" stroke-width="2"/>
<text x="48" y="164" font-size="28" fill="#7851bd" text-anchor="start" font-weight="700">① Router：逐 token 决定专家</text>
<rect x="48" y="185" width="186" height="45" rx="12" fill="#e9f0ff" stroke="none" stroke-width="2"/><text x="141.0" y="217.3" font-size="28" fill="#2864ce" text-anchor="middle" font-weight="600">A</text>
<text x="141" y="270" font-size="26" fill="#7851bd" text-anchor="middle" font-weight="600">E1 + E3</text>
<rect x="274" y="185" width="186" height="45" rx="12" fill="#e9f0ff" stroke="none" stroke-width="2"/><text x="367.0" y="217.3" font-size="28" fill="#2864ce" text-anchor="middle" font-weight="600">B</text>
<text x="367" y="270" font-size="26" fill="#7851bd" text-anchor="middle" font-weight="600">E2 + E3</text>
<rect x="500" y="185" width="186" height="45" rx="12" fill="#e9f0ff" stroke="none" stroke-width="2"/><text x="593.0" y="217.3" font-size="28" fill="#2864ce" text-anchor="middle" font-weight="600">C</text>
<text x="593" y="270" font-size="26" fill="#7851bd" text-anchor="middle" font-weight="600">E1 + E4</text>
<rect x="726" y="185" width="186" height="45" rx="12" fill="#e9f0ff" stroke="none" stroke-width="2"/><text x="819.0" y="217.3" font-size="28" fill="#2864ce" text-anchor="middle" font-weight="600">D</text>
<text x="819" y="270" font-size="26" fill="#7851bd" text-anchor="middle" font-weight="600">E2 + E4</text>
<path d="M480,307 L480,342" fill="none" stroke="#7851bd" stroke-width="3" marker-end="url(#arrow-purple)"/>
<text x="509" y="334" font-size="25" fill="#7851bd" text-anchor="start" font-weight="400">Dispatch：重排与分组</text>
<rect x="24" y="358" width="912" height="196" rx="12" fill="white" stroke="none" stroke-width="2"/>
<text x="48" y="399" font-size="28" fill="#b96111" text-anchor="start" font-weight="700">② 专家 FFN：各算各自收到的 token</text>
<rect x="48" y="423" width="186" height="48" rx="12" fill="#fff0de" stroke="none" stroke-width="2"/><text x="141.0" y="456.8" font-size="28" fill="#b96111" text-anchor="middle" font-weight="600">E1</text>
<text x="141" y="518" font-size="28" fill="#172b45" text-anchor="middle" font-weight="600">A、C</text>
<rect x="274" y="423" width="186" height="48" rx="12" fill="#fff0de" stroke="none" stroke-width="2"/><text x="367.0" y="456.8" font-size="28" fill="#b96111" text-anchor="middle" font-weight="600">E2</text>
<text x="367" y="518" font-size="28" fill="#172b45" text-anchor="middle" font-weight="600">B、D</text>
<rect x="500" y="423" width="186" height="48" rx="12" fill="#fff0de" stroke="none" stroke-width="2"/><text x="593.0" y="456.8" font-size="28" fill="#b96111" text-anchor="middle" font-weight="600">E3</text>
<text x="593" y="518" font-size="28" fill="#172b45" text-anchor="middle" font-weight="600">A、B</text>
<rect x="726" y="423" width="186" height="48" rx="12" fill="#fff0de" stroke="none" stroke-width="2"/><text x="819.0" y="456.8" font-size="28" fill="#b96111" text-anchor="middle" font-weight="600">E4</text>
<text x="819" y="518" font-size="28" fill="#172b45" text-anchor="middle" font-weight="600">C、D</text>
<path d="M480,563 L480,598" fill="none" stroke="#7851bd" stroke-width="3" marker-end="url(#arrow-purple)"/>
<text x="509" y="590" font-size="25" fill="#7851bd" text-anchor="start" font-weight="400">Combine：加权并还原</text>
<rect x="24" y="614" width="912" height="226" rx="12" fill="white" stroke="none" stroke-width="2"/>
<text x="48" y="655" font-size="28" fill="#087e86" text-anchor="start" font-weight="700">③ 输出：恢复 A、B、C、D 的原顺序</text>
<rect x="48" y="679" width="186" height="48" rx="12" fill="#e5f5f3" stroke="none" stroke-width="2"/><text x="141.0" y="712.8" font-size="28" fill="#087e86" text-anchor="middle" font-weight="600">A′</text>
<text x="141" y="772" font-size="22" fill="#52657c" text-anchor="middle" font-weight="400">E1(A)、E3(A)</text>
<text x="141" y="810" font-size="23" fill="#087e86" text-anchor="middle" font-weight="400">按权重求和</text>
<rect x="274" y="679" width="186" height="48" rx="12" fill="#e5f5f3" stroke="none" stroke-width="2"/><text x="367.0" y="712.8" font-size="28" fill="#087e86" text-anchor="middle" font-weight="600">B′</text>
<text x="367" y="772" font-size="22" fill="#52657c" text-anchor="middle" font-weight="400">E2(B)、E3(B)</text>
<text x="367" y="810" font-size="23" fill="#087e86" text-anchor="middle" font-weight="400">按权重求和</text>
<rect x="500" y="679" width="186" height="48" rx="12" fill="#e5f5f3" stroke="none" stroke-width="2"/><text x="593.0" y="712.8" font-size="28" fill="#087e86" text-anchor="middle" font-weight="600">C′</text>
<text x="593" y="772" font-size="22" fill="#52657c" text-anchor="middle" font-weight="400">E1(C)、E4(C)</text>
<text x="593" y="810" font-size="23" fill="#087e86" text-anchor="middle" font-weight="400">按权重求和</text>
<rect x="726" y="679" width="186" height="48" rx="12" fill="#e5f5f3" stroke="none" stroke-width="2"/><text x="819.0" y="712.8" font-size="28" fill="#087e86" text-anchor="middle" font-weight="600">D′</text>
<text x="819" y="772" font-size="22" fill="#52657c" text-anchor="middle" font-weight="400">E2(D)、E4(D)</text>
<text x="819" y="810" font-size="23" fill="#087e86" text-anchor="middle" font-weight="400">按权重求和</text>
<text x="36" y="890" font-size="26" fill="#172b45" text-anchor="start" font-weight="600">4 个输入 token → 8 份专家任务 → 4 个输出隐藏状态</text>
</svg>
