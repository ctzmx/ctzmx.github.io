<svg xmlns="http://www.w3.org/2000/svg" width="440" height="446.111" viewBox="0 0 720 730" role="img" aria-labelledby="title desc">
<title id="title">同一个 6.5，两种 16 位编码</title>
<desc id="desc">FP16 与 BF16 都精确表示 6.5。FP16 为 0|10001|1010000000，BF16 为 0|10000001|1010000。隐含的前导 1 不在存储位格中。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs>
