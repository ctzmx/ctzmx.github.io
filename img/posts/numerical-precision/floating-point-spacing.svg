<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="415.556" viewBox="0 0 720 680" role="img" aria-labelledby="title desc">
<title id="title">同一数轴上，FP16 的刻度更密</title>
<desc id="desc">两个局部线性窗口。1 到 1.015625 内 FP16 有 17 个点、BF16 有 3 个点；1024 到 1040 内也分别有 17 个点和 3 个点。不同窗口的单位跨度不同。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs>
