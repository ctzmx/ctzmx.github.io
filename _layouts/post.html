---
layout: default
---

{% include hero.html %}

<div class="container article-shell">
    <article class="article">
        {{ content }}
    </article>

    {% if page.catalog != false %}
    <aside class="article-toc" aria-label="文章目录" hidden>
        <p class="toc-title">目录</p>
        <nav id="post-toc"></nav>
    </aside>
    {% endif %}
</div>

<nav class="container post-nav">
    {% if page.previous.url %}
    <a href="{{ page.previous.url | relative_url }}">&larr; {{ page.previous.title | escape }}</a>
    {% endif %}
    {% if page.next.url %}
    <a href="{{ page.next.url | relative_url }}">{{ page.next.title | escape }} &rarr;</a>
    {% endif %}
</nav>

{% if page.catalog != false %}
<script src="{{ '/assets/js/toc.js' | relative_url }}" defer></script>
{% endif %}
